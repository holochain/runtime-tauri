name: CI

on:
  pull_request:
    branches:
      - main
      - main-*
  push:
    branches:
      - main

# A new push to a PR cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Test Rust crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      # `npm run ci` = fmt --check + clippy -Dwarnings + the runtime, plugin and
      # generator test suites + a build of the example app.
      - name: Run tests
        run: |
          nix develop --no-update-lock-file --command bash -c "npm ci && npm run ci"

      - name: Check for uncommitted changes
        run: git diff --exit-code

  build-desktop:
    name: Build example (desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - name: Build holochain-runtime-example
        run: |
          nix develop --no-update-lock-file --command bash -c "npm ci && npm run build:example && cargo build -p holochain-runtime-example"

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          swap-storage: false

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - name: Build debug APK
        run: |
          nix develop --no-update-lock-file --command bash -c "npm ci && npm run build:example-android -- --debug --target x86_64 --apk"

  # The org-wide rulesets (holochain/hc-github-config) require a single status
  # check named `ci_pass` on `main` and the release branches. It succeeds only
  # when every job above succeeded.
  ci_pass:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - test-rust
      - build-desktop
      - build-android
    steps:
      - name: check status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
