name: CI

on:
  pull_request:
    branches:
      - main
      - main-*
  push:
    branches:
      - main

# A new push to a PR cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Test Rust crates and build desktop example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ hashFiles('flake.lock') }}
          cmd-format: nix develop --no-update-lock-file --command {0}

      - name: Install Node dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - name: Check Rust formatting
        run: nix develop --no-update-lock-file --command cargo fmt --all -- --check

      - name: Build example UI
        run: nix develop --no-update-lock-file --command npm run build -w holochain-runtime-example-ui

      - name: Lint Rust
        run: nix develop --no-update-lock-file --command cargo clippy --workspace --all-targets -- -Dwarnings

      - name: Test conductor runtime
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: info
        run: nix develop --no-update-lock-file --command cargo test -p holochain-conductor-runtime -- --nocapture

      - name: Test Tauri plugin
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: info
        run: nix develop --no-update-lock-file --command cargo test -p tauri-plugin-holochain -- --nocapture

      - name: Build desktop example
        run: nix develop --no-update-lock-file --command cargo build -p holochain-runtime-example

      - name: Test app generator
        run: nix develop --no-update-lock-file --command npm test -w create-holochain-tauri

      - name: Check for uncommitted changes
        run: git diff --exit-code

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          swap-storage: false

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ hashFiles('flake.lock') }}
          cmd-format: nix develop --no-update-lock-file --command {0}

      - name: Build debug APK
        run: |
          nix develop --no-update-lock-file --command bash -c "npm ci && npm run build:example-android -- --debug --target x86_64 --apk"

  # The org-wide rulesets (holochain/hc-github-config) require a single status
  # check named `ci_pass` on `main` and the release branches. It succeeds only
  # when every job above succeeded.
  ci_pass:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - test-rust
      - build-android
    steps:
      - name: check status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
