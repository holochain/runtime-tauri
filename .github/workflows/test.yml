name: Test

on:
  pull_request:
    branches:
      - main
      - main-*
  push:
    branches:
      - main

jobs:
  test-rust:
    name: Test Rust crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      # `make test` = fmt --check + clippy -Dwarnings + the runtime and plugin
      # test suites + a build of the example app.
      - name: Run tests
        run: |
          nix develop --no-update-lock-file --command bash -c "pnpm install && make test"
