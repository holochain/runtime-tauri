[package]
name = "tauri-plugin-hc"
version = "0.1.0"
exclude = ["/examples", "/node_modules"]
links = "tauri-plugin-hc"
description = "Tauri plugin that runs an in-process Holochain conductor (FFI-free, desktop + mobile)"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The wasm backend (cranelift vs. wasmi on iOS) is selected by target cfg in
# holochain-conductor-runtime's Cargo.toml and unifies across the graph.
holochain-conductor-runtime = { path = "../runtime", version = "0.1.0" }
holochain = { workspace = true, features = ["encryption", "schema"] }
lair_keystore_api = { workspace = true }
sodoken = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url2 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
app_dirs2 = "2.5.5"

# Android: initialize ndk_context at library load (see src/android.rs). Same
# versions tao/wry already pull in, so no extra copies.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1.1"

# Linux: answer WebKitGTK's permission-request signal so getUserMedia works
# (see src/linux_media.rs). Same version and features tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[features]
test-utils = ["tauri/test"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
holochain = { workspace = true }
holochain_types = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
test-happ = { path = "../test-happ" }
# Self-dependency: what turns `test-utils` on for this crate's own test targets.
tauri-plugin-hc = { path = ".", features = ["test-utils"] }
