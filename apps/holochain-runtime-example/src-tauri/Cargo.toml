[package]
name = "holochain-runtime-example"
version = "0.1.0"
description = "Example app for the in-process tauri-plugin-hc (desktop, Android, iOS)"
edition.workspace = true
license.workspace = true

[lib]
name = "holochain_runtime_example_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# The wasm backend (cranelift vs. wasmi on iOS) is selected by target cfg in
# crates/runtime; no feature flags are needed at any build entry point.
tauri-plugin-hc = { path = "../../../crates/tauri-plugin-hc" }
tauri-plugin-log = "2"
holochain = { workspace = true, features = ["encryption", "schema"] }
log = { workspace = true }
