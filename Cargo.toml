[workspace]
members = [
    "crates/runtime",
    "crates/tauri-plugin-hc",
    "crates/test-happ",
    "apps/holochain-runtime-example/src-tauri",
]
# The test hApp's zomes build for wasm32 in a workspace of their own.
exclude = ["crates/test-happ/zomes"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
homepage = "https://github.com/holochain/runtime-tauri"
repository = "https://github.com/holochain/runtime-tauri"
keywords = ["holochain", "tauri", "p2p", "desktop", "mobile"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# default-features = false so the wasm backend is not pinned here: the defaults
# include `wasmer-sys-cranelift` (a JIT), which cannot run on iOS, and default
# features cannot be subtracted downstream. Every member that depends on
# holochain re-adds `encryption` + `schema`; the backend itself is chosen per
# target in crates/runtime/Cargo.toml.
holochain = { version = "0.7.0", default-features = false }
holochain_types = "0.7.0"
# Network-stats types (ApiTransportStats) returned by AdminRequest::DumpNetworkStats;
# pinned to the version holochain 0.7.0 resolves so it unifies to one copy.
kitsune2_api = "0.5.0"
sodoken = "0.1.0"
url2 = "0.0.6"
lair_keystore_api = "0.7.1"
rustls = "0.23.25"

tauri = "2.5.1"
tauri-plugin = "2.2.0"
tauri-build = { version = "2.2.0", default-features = false }

base64 = "0.23"
log = "0.4.25"
serde = "1.0"
serde_json = "1.0.140"
thiserror = "2.0.11"
zeroize = "1.8.1"
tempfile = "3.17.1"
tokio = "1.43.0"
uuid = "1.15.1"

# Optimize dependencies in dev and test builds. Unoptimized, the conductor,
# wasmer/cranelift and lair are an order of magnitude slower: a new cell's first
# zome call (wasm compile + init) measured 29.6 s vs 2.9 s, conductor boot 19.7 s
# vs 1.7 s. Workspace crates stay unoptimized so editing them rebuilds quickly.
# Apps using tauri-plugin-hc need the same setting in their own workspace root.
#
# debug = false drops dependency debug info. Without it an Android debug library
# is ~1.3 GB (1.18 GB of it DWARF, 68 MB of code), too large to install on an
# emulator. Dependency symbols stay, so backtraces keep function names.
[profile.dev.package."*"]
opt-level = 3
debug = false
